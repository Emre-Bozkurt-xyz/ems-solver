name: Release

# Push a tag like v0.2.0 (after `node client/scripts/version.mjs set 0.2.0`) to build
# installers for Windows and Linux into a draft GitHub Release. Publishing the draft
# makes it the version the apps update to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 so the Linux builds also run on older releases than the latest.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: node client/scripts/version.mjs check "${GITHUB_REF_NAME#v}"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: ems-solver ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download the `-setup.exe`. Windows may warn about an unknown publisher; choose *More info → Run anyway*.
            **Ubuntu / Debian:** download the `.deb` and install it with `sudo apt install ./ems-solver_*.deb`.
            **Other Linux:** the `.AppImage` runs anywhere; make it executable first.

            Setup instructions are in the README.
          releaseDraft: true
          includeUpdaterJson: true

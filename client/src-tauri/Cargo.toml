[package]
name = "ems-solver"
version = "0.1.0"
description = "Tray app that sends clipboard text and screenshots to an LLM and pastes the answer"
edition = "2021"
publish = false

[lib]
name = "ems_solver_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "rt-multi-thread", "rt"] }
uuid = { version = "1.28.0", features = ["v4"] }
which = "8.0.6"

[build-dependencies]
tauri-build = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console"] }
